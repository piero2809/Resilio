<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resilio | Recuperar Contraseña</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .language-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .language-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .language-btn:hover {
            color: var(--text-primary);
            border-color: var(--neon-green);
        }

        .language-btn.active {
            background: rgba(73, 243, 190, 0.1);
            color: var(--neon-green);
            border-color: var(--neon-green);
        }
    </style>
    <script>
        // Aplicar tema antes de cargar
        (function() {
            const savedTheme = localStorage.getItem('resilio-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body class="auth-page">
    <div class="language-switcher">
        <button class="language-btn" data-lang="es" onclick="setLanguage('es')">ES</button>
        <button class="language-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
        <button class="language-btn" data-lang="ca" onclick="setLanguage('ca')">CA</button>
    </div>
    <div class="login-wrapper">
        <div class="login-card">
            <header class="logo-container">
                <img src="{{ url_for('static', filename='img/resilio-logo-sinfondo.png') }}"
                     alt="Resilio Logo"
                     class="main-logo">
                <p class="tagline" data-i18n="recuperarContrasena">Recuperar Contraseña</p>
            </header>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/forgot_password" method="POST" class="login-form">
                <div class="input-field">
                    <label data-i18n="emailLabel">Ingresa tu email para recibir un enlace de recuperación</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-at"></i>
                        <input type="email" name="email" placeholder="usuario@resilio.com" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary" data-i18n="enviarEnlace">Enviar Enlace</button>

                <div class="form-footer" style="margin-top: 20px;">
                    <a href="/login" class="help-link" data-i18n="volverLogin">Volver al inicio de sesión</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const translations = {
            es: {
                recuperarContrasena: "Recuperar Contraseña",
                emailLabel: "Ingresa tu email para recibir un enlace de recuperación",
                enviarEnlace: "Enviar Enlace",
                volverLogin: "Volver al inicio de sesión"
            },
            en: {
                recuperarContrasena: "Recover Password",
                emailLabel: "Enter your email to receive a recovery link",
                enviarEnlace: "Send Link",
                volverLogin: "Back to login"
            },
            ca: {
                recuperarContrasena: "Recuperar Contrasenya",
                emailLabel: "Introdueix el teu correu per rebre un enllaç de recuperació",
                enviarEnlace: "Enviar Enllaç",
                volverLogin: "Tornar a l'inici de sessió"
            }
        };

        function setLanguage(lang) {
            localStorage.setItem('resilio-language', lang);
            applyTranslations(lang);
        }

        function applyTranslations(lang) {
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            document.documentElement.lang = lang;

            document.querySelectorAll('.language-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.lang === lang) {
                    btn.classList.add('active');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const savedLang = localStorage.getItem('resilio-language') || 'es';
            applyTranslations(savedLang);
        });
    </script>
</body>

</html>
